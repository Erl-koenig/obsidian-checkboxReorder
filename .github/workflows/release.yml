name: Release

on:
  push:
    tags:
      - "[0-9]+.[0-9]+.[0-9]+"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    name: Build and publish release assets
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Test
        run: npm test

      - name: Build
        run: npm run build

      - name: Validate tag version
        if: github.event_name == 'push'
        run: |
          TAG_VERSION="$GITHUB_REF_NAME"
          MANIFEST_VERSION="$(node -p "require('./manifest.json').version")"

          if [ "$TAG_VERSION" != "$MANIFEST_VERSION" ]; then
            echo "Tag version $TAG_VERSION does not match manifest.json version $MANIFEST_VERSION."
            exit 1
          fi

      - name: Collect release assets
        run: |
          mkdir -p release
          cp main.js manifest.json release/

      - name: Upload build artifact
        uses: actions/upload-artifact@v7
        with:
          name: checkbox-reorder-release
          path: release/*
          if-no-files-found: error

      - name: Publish GitHub release
        if: github.event_name == 'push'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" release/* \
            --title "$GITHUB_REF_NAME" \
            --generate-notes
